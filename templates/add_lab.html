{% extends "base.html" %}
{% block title %}Add Lab Result{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1>Add Lab Result</h1>
    <div class="breadcrumb">🏥 CliniCore &rsaquo; <a href="/lab_results">Lab Results</a> &rsaquo; Add</div>
  </div>
</div>

<div style="max-width:680px;">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title"><span class="ptitle-icon">🧪</span>Laboratory Entry</div>
    </div>
    <div class="panel-body">
      <form method="POST" action="/lab_results/add">
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label" for="visit_id">Visit <span style="color:#b91c1c">*</span></label>
            <select class="form-control" id="visit_id" name="visit_id" required>
              <option value="" disabled selected>Select visit…</option>
              {% for v in visits %}
              <option value="{{ v.visit_id }}">
                #V{{ '%04d' % v.visit_id }} — {{ v.patient_name }} ({{ v.visit_date }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="test_name">Test Name <span style="color:#b91c1c">*</span></label>
            <input class="form-control" type="text" id="test_name" name="test_name"
                   placeholder="e.g. Fasting Blood Sugar" required maxlength="100">
          </div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="result_value">Result Value <span style="color:#b91c1c">*</span></label>
            <input class="form-control" type="text" id="result_value" name="result_value"
                   placeholder="e.g. 165 mg/dL" required maxlength="50">
            <div class="form-hint">Include units where applicable (mg/dL, mmHg, g/dL, etc.)</div>
          </div>
        </div>
        <div class="form-actions">
          <a href="/lab_results" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">✅ Add Lab Result</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
