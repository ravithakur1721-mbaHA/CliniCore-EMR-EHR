{% extends "base.html" %}
{% block title %}Add Medication{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1>Prescribe Medication</h1>
    <div class="breadcrumb">🏥 CliniCore &rsaquo; <a href="/medications">Medications</a> &rsaquo; Prescribe</div>
  </div>
</div>

<div style="max-width:680px;">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title"><span class="ptitle-icon">💊</span>Prescription Entry</div>
    </div>
    <div class="panel-body">
      <form method="POST" action="/medications/add">
        <div class="form-grid" style="margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label" for="visit_id">Visit <span style="color:#b91c1c">*</span></label>
            <select class="form-control" id="visit_id" name="visit_id" required>
              <option value="" disabled selected>Select visit…</option>
              {% for v in visits %}
              <option value="{{ v.visit_id }}">
                #V{{ '%04d' % v.visit_id }} — {{ v.patient_name }} ({{ v.visit_date }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="drug_name">Drug / Medication <span style="color:#b91c1c">*</span></label>
            <input class="form-control" type="text" id="drug_name" name="drug_name"
                   placeholder="e.g. Metformin" required maxlength="100">
          </div>

          <div class="form-group">
            <label class="form-label" for="dosage">Dosage <span style="color:#b91c1c">*</span></label>
            <input class="form-control" type="text" id="dosage" name="dosage"
                   placeholder="e.g. 500 mg BD" required maxlength="50">
            <div class="form-hint">OD = Once daily, BD = Twice, TID = Three times, SOS = As needed</div>
          </div>
        </div>
        <div class="form-actions">
          <a href="/medications" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">💊 Prescribe</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
